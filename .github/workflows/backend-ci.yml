name: Backend CI

on:
  push:
    branches:
     - develop
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
  steps:
    - name: checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install dependencies
      run:  npm ci

    - name: Generate Prisma Client
      run:  npx prisma generate

    - name: Build backend
      run:  npm run build

    - name: Run tests
      run:  npm test  -- --runInBand